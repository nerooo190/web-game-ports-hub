name: Build apps
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  desktop:
    strategy:
      matrix:
        include:
          - { os: windows-latest, script: 'dist:win' }
          - { os: ubuntu-latest, script: 'dist:linux' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci || npm install
        working-directory: electron
      - run: npm run ${{ matrix.script }}
        working-directory: electron
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            electron/dist/*.exe
            electron/dist/*.AppImage

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm ci || npm install
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv artifacts/android-apk/app-debug.apk "artifacts/Web-Game-Ports-Hub-${GITHUB_REF_NAME}.apk"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "Web Game Ports Hub ${GITHUB_REF_NAME#v}" \
            --notes "Windows: Setup installer or portable .exe (unsigned). Linux: AppImage (chmod +x). Android / Android TV: debug-signed APK (sideload). No games are bundled." \
            artifacts/desktop-*/*.exe artifacts/desktop-*/*.AppImage artifacts/*.apk
